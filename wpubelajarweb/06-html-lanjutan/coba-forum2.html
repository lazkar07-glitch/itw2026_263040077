<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Input Atribut, Checkbox, & Radio Button</title>
</head>
<body>
    <h1>contoh input atribut, checkbox, & radio button</h1>

    <form>
        <label for="nama">nama:
            <input type="text" name="nama" id="nama" placeholder="masukkan nama anda" autocomplete="off" autofocus required>
        </label>
        <br>

        <h3>Hobby:</h3>
        <label for="hobby1"> olahraga
            <input type="checkbox" name="hobby1" id="hobby1" value="olahraga"> 
        </label>
        <br>
        <button type="submit">Kirim!</button>
        <br>

        <h3>Jenis Kelamin:</h3>
        <label for="laki-laki">Laki-laki
            <input type="radio" name="gender" id="laki-laki" value="laki-laki" checked>
        </label>
        <br>
        <label for="perempuan">Perempuan
            <input type="radio" name="gender" id="perempuan" value="perempuan">
        </label>
    </form>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
</html>
